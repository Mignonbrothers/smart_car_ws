person_follower:
  ros__parameters:
    detection_topic: "/person_detection"
    scan_topic: "/scan"
    pan_angle_topic: "/pan_tilt/pan_angle"
    cmd_vel_topic: "/cmd_vel"

    stop_distance_m: 0.80
    follow_distance_m: 1.30
    far_distance_m: 1.80
    normal_linear_velocity: 0.08
    fast_linear_velocity: 0.12

    max_angular_velocity: 0.18
    body_turn_kp: 0.3
    aligned_angle_threshold_rad: 0.08
    realign_angle_threshold_rad: 0.18

    lost_timeout_s: 2.00
    min_detection_confidence: 0.50
